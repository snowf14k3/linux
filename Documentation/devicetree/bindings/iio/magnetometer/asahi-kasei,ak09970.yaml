%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/magnetometer/asahi-kasei,ak09970.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Asahi Kasei AK09970 Hall magnetic position sensor

maintainers:
  - snowf14k3 <60956553+snowf14k3@users.noreply.github.com>

description: |
  The AK09970 reports magnetic measurements over I2C and signals data
  ready through an interrupt. On Raphael it observes the popup camera
  mechanism. Position thresholds depend on the assembled mechanism and
  are not defined by the sensor itself.

properties:
  compatible:
    const: asahi-kasei,ak09970

  reg:
    maxItems: 1

  interrupts-extended:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply: true

  asahi-kasei,measure-freq-hz:
    enum: [10, 20, 50, 100]
    default: 100

  pinctrl-names:
    items:
      - const: default

  pinctrl-0: true

required:
  - compatible
  - reg
  - interrupts-extended
  - reset-gpios
  - vdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        hall-sensor@c {
            compatible = "asahi-kasei,ak09970";
            reg = <0x0c>;
            interrupts-extended = <&tlmm 27 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&tlmm 11 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vreg_l8c_1p8>;
            asahi-kasei,measure-freq-hz = <100>;
        };
    };
...

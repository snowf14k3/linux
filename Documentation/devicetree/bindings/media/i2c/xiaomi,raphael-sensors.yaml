%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/xiaomi,raphael-sensors.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi Raphael IMX586, OV8856, S5K3L6 and S5K3T2 image sensors

maintainers:
  - snowf14k3 <60956553+snowf14k3@users.noreply.github.com>

description:
  Camera modules connected to the SM8150 CAMSS on Xiaomi Raphael.
  The modules use a 19.2 MHz input clock and four CSI-2 D-PHY lanes.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#
  - if:
      properties:
        compatible:
          const: sony,imx586
    then:
      required:
        - custom1-supply
    else:
      properties:
        custom1-supply: false

properties:
  compatible:
    enum:
      - sony,imx586
      - xiaomi,raphael-ov8856
      - samsung,s5k3l6
      - samsung,s5k3t2

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: xvclk

  avdd-supply:
    description: Analog supply.

  dvdd-supply:
    description: Digital core supply.

  dovdd-supply:
    description: Digital interface supply.

  custom1-supply:
    description: Additional IMX586 module supply from PM8150 S5.

  reset-gpios:
    maxItems: 1

  flash-leds: true
  lens-focus: true

  orientation: true
  rotation: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4
        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - reset-gpios
  - port

additionalProperties: false

%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/dongwoon,dw9763.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dongwoon DW9763 voice coil lens actuator

maintainers:
  - snowf14k3 <60956553+snowf14k3@users.noreply.github.com>

description:
  The DW9763 is a 10-bit I2C voice coil actuator. On Xiaomi Raphael,
  the main and telephoto modules connect it to separate CCI buses and
  switch a dedicated 2.8 V actuator supply for each module.

properties:
  compatible:
    const: dongwoon,dw9763

  reg:
    maxItems: 1

  vin-supply:
    description: 1.8 V I2C interface supply shared with the camera module.

  vdd-supply:
    description: 2.8 V actuator supply.

required:
  - compatible
  - reg
  - vin-supply
  - vdd-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera-lens@c {
            compatible = "dongwoon,dw9763";
            reg = <0x0c>;
            vin-supply = <&camera_vio>;
            vdd-supply = <&camera_main_vaf>;
        };
    };
...

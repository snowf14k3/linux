%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-fg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B Gen4 fuel gauge

maintainers:
  - snowf14k3 <60956553+snowf14k3@users.noreply.github.com>

description:
  The optional DMA SRAM path reads battery temperature after programming
  board-specific thermistor coefficients. It requires the battery-missing
  interrupt and remains disabled unless qcom,fg-gen4-dma is present.

properties:
  compatible:
    const: qcom,pm8150b-fg

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    maxItems: 2
    items:
      - const: soc-delta
      - const: batt-missing

  monitored-battery: true

  power-supplies:
    maxItems: 1

  qcom,fg-gen4-dma:
    type: boolean
    description: Enable the PM8150B Gen4 DMA SRAM and calibrated temperature path.

  qcom,fg-therm-coefficients:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 5
    maxItems: 5
    items:
      minimum: 0
      maximum: 65535
    description: Five board battery thermistor coefficients in SRAM word order.

  qcom,fg-therm-center-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 255
    description: Battery thermistor center offset in SRAM word 3.

  qcom,fg-therm-pull-up-kohms:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [30, 100, 400]
    description: Battery thermistor pull-up resistance in kilohms.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

allOf:
  - $ref: power-supply.yaml#
  - if:
      required:
        - qcom,fg-gen4-dma
    then:
      properties:
        interrupts:
          minItems: 2
        interrupt-names:
          minItems: 2
      required:
        - qcom,fg-therm-coefficients
        - qcom,fg-therm-center-offset
        - qcom,fg-therm-pull-up-kohms

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
        #address-cells = <1>;
        #size-cells = <0>;

        fuel-gauge@4000 {
            compatible = "qcom,pm8150b-fg";
            reg = <0x4000>;
            interrupts = <0x2 0x40 0x3 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "soc-delta";
        };
    };
...

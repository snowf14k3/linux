%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/ti,drv8846.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI DRV8846 stepper motor in the Xiaomi Raphael popup camera

maintainers:
  - snowf14k3 <60956553+snowf14k3@users.noreply.github.com>

description: |
  The Raphael board uses a DRV8846 with a PM8150L PWM step clock and
  GPIO control lines. The fault input is active low. The motor driver
  applies a bounded three-stage pulse sequence and leaves the bridge
  asleep and unpowered whenever idle.

properties:
  compatible:
    const: ti,drv8846

  pwms:
    maxItems: 1

  mode0-gpios:
    maxItems: 1

  mode1-gpios:
    maxItems: 1

  dir-gpios:
    maxItems: 1

  sleep-gpios:
    maxItems: 1

  enable-gpios:
    maxItems: 1

  fault-gpios:
    maxItems: 1

  ti,rampup-period-ns:
    minimum: 50000
    maximum: 1000000

  ti,high-period-ns:
    minimum: 50000
    maximum: 1000000

  ti,rampdown-period-ns:
    minimum: 50000
    maximum: 1000000

  ti,rampup-duration-ms:
    minimum: 1
    maximum: 1500

  ti,high-duration-ms:
    minimum: 1
    maximum: 1500

  ti,rampdown-duration-ms:
    minimum: 1
    maximum: 1500

  ti,step-mode:
    enum: [0, 1, 2, 3]

  pinctrl-names:
    items:
      - const: default

  pinctrl-0: true

required:
  - compatible
  - pwms
  - mode0-gpios
  - mode1-gpios
  - dir-gpios
  - sleep-gpios
  - enable-gpios
  - fault-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    motor {
        compatible = "ti,drv8846";
        pwms = <&pwm 4 1000000>;
        mode0-gpios = <&tlmm 21 GPIO_ACTIVE_HIGH>;
        mode1-gpios = <&tlmm 33 GPIO_ACTIVE_HIGH>;
        dir-gpios = <&tlmm 9 GPIO_ACTIVE_HIGH>;
        sleep-gpios = <&tlmm 35 GPIO_ACTIVE_HIGH>;
        enable-gpios = <&tlmm 130 GPIO_ACTIVE_HIGH>;
        fault-gpios = <&tlmm 36 GPIO_ACTIVE_LOW>;
    };
...
